type Pick {
  id: ID!
  user: User!
  league: FantasyLeague!
  team: SportsTeam!
  week: Int
  isInvalidated: Boolean!
}

input SubmitPickRequest {
  userID: ID!
  leagueID: ID!
  teamIDs: [ID!]
  week: Int!
}

type SubmitPickResponse {
  pick: [Pick!]
  errors: [Error!]
}

input InvalidatePicksRequest {
  pickIDs: [ID!]!
}

type InvalidatePicksResponse {
  success: Boolean!
  errors: [Error!]
}

type User {
  id: ID!
  email: String!
  limited: Boolean!
  displayName(leagueID: ID!): String
  favoriteTeam(leagueID: ID!): SportsTeam
  fantasyLeagues: [FantasyLeague!]
}

input CreateUserRequest {
  email: String!
}

type CreateUserResponse {
  user: User
  errors: [Error!]
}

input AddUserToFantasyLeagueRequest {
  userID: ID!
  leagueID: ID!
}

type AddUserToFantasyLeagueResponse {
  league: FantasyLeague
  errors: [Error!]
}

input SetFavoriteTeamRequest {
  userID: ID!
  leagueID: ID!
  teamID: ID!
}

type SetFavoriteTeamResponse {
  favoriteTeam: SportsTeam
  errors: [Error!]
}

type FantasyLeague {
  id: ID!
  name: String!
  owner: User!
  users: [User!]
  messageEligibleUsers: [User!]!
  picks: [Pick!]
  achievementAwards: [AchievementAward!]!
  messages(week: Int): [LeagueMessage!]!
  gameMode: GameMode!
  currentWeek: Int!
  revealedWeek: Int!
  season: String!
}

type Achievement {
  id: ID!
  key: String!
  name: String!
  description: String!
  iconId: String
}

type AchievementAward {
  id: ID!
  week: Int!
  awardedAt: String!
  user: User!
  achievement: Achievement!
}

enum MessageValueKind {
  CATALOG_VALUE
  ADJECTIVE
}

enum MessageSlotValueType {
  CATALOG_VALUE
  ADJECTIVE
  LEAGUE_MEMBER
  TEAM
}

type MessageValue {
  id: ID!
  key: String!
  text: String!
  kind: MessageValueKind!
}

type MessageTemplateSlot {
  id: ID!
  key: String!
  position: Int!
  prompt: String
  valueTypes: [MessageSlotValueType!]!
}

type MessageTemplate {
  id: ID!
  key: String!
  format: String!
  slots: [MessageTemplateSlot!]!
}

union MessageSelectionValue = MessageValue | SportsTeam | User

type LeagueMessageSelection {
  slot: MessageTemplateSlot!
  value: MessageSelectionValue!
}

type LeagueMessage {
  id: ID!
  week: Int!
  createdAt: String!
  author: User!
  template: MessageTemplate!
  selections: [LeagueMessageSelection!]!
}

input SubmitMessageSelection {
  slotID: ID!
  valueType: MessageSlotValueType!
  valueID: ID!
}

input SubmitMessageRequest {
  userID: ID!
  leagueID: ID!
  week: Int!
  templateID: ID!
  selections: [SubmitMessageSelection!]!
}

type SubmitMessageResponse {
  message: LeagueMessage
  errors: [Error!]
}

input CreateFantasyLeagueRequest {
  name: String!
  ownerID: ID!
  gameMode: GameMode!
}

type CreateFantasyLeagueResponse {
  league: FantasyLeague
  errors: [Error!]
}

type SportsTeam {
  id: ID!
  name: String!
  shortName: String!
  sportsLeague: SportsLeague!
}

type SportsGame {
  id: ID!
  sportsLeague: SportsLeague!
  startsAt: String!
  awayTeam: SportsTeam!
  homeTeam: SportsTeam!
  season: String!
  week: Int!
  result: SportsGameResult
}

type SportsGameResult {
  complete: Boolean!
  awayTeamScore: Int
  homeTeamScore: Int
}

input CreateSportsGameRequest {
  league: SportsLeague
  awayTeamShortName: String!
  homeTeamShortName: String!
  scheduledStart: String
  season: String
  round: Int
}

type CreateSportsGameResponse {
  sportsGame: SportsGame
  errors: [Error!]
}

type Query {
  user(email: String!): User
  league(leagueID: ID!): FantasyLeague
  leagues(userID: String): [FantasyLeague!]
  messageTemplates: [MessageTemplate!]!
  messageValues(kind: MessageValueKind): [MessageValue!]!
  currentPick(leagueID: ID!, userID: ID!): [Pick!]
  picksForUser(leagueID: ID!, userID: ID!): [Pick!]
  sportsTeams(league: SportsLeague): [SportsTeam!]
  sportsGames(league: SportsLeague, season: String, week: Int): [SportsGame!]
  currentSeason(league: SportsLeague): String
}

type Mutation {
  #createUser(request: CreateUserRequest!): CreateUserResponse
  #createFantasyLeague(request: CreateFantasyLeagueRequest!): CreateFantasyLeagueResponse
  #addUserToFantasyLeague(request: AddUserToFantasyLeagueRequest!): AddUserToFantasyLeagueResponse
  setFavoriteTeam(request: SetFavoriteTeamRequest!): SetFavoriteTeamResponse
  submitMessage(request: SubmitMessageRequest!): SubmitMessageResponse
  submitPick(request: SubmitPickRequest!): SubmitPickResponse
  invalidatePicks(request: InvalidatePicksRequest!): InvalidatePicksResponse
  #createSportsGame(request: CreateSportsGameRequest!): CreateSportsGameResponse
}

type Error {
  code: String!
  message: String
}

enum SportsLeague {
  NFL
}

enum GameMode {
  PICK_TWO
  STREAKIN
  SURVIVOR
}
